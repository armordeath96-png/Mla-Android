
name: Build MLA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -q MLA_Android_Project_v0_1.zip

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MLA_Android_Project/app/build.gradle.kts")
          s = p.read_text()
          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if "compileOptions {" not in s:
              s = s.replace("android {", "android {\n" + block, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p MLA_Android_Project assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLA-game-debug-APK
          path: MLA_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
